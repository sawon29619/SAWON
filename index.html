<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>আমার হিসাব</title>
<style>
:root{
  --bg:#eef3f1; --card:#ffffff; --ink:#16302a; --muted:#5f7a72; --line:#d5e1dc;
  --in:#1b8a5a; --out:#c0392f; --head:#0f3d33; --headink:#f2fbf7;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1815; --card:#16251f; --ink:#e6f2ed; --muted:#8fa9a0; --line:#27403834; --in:#4fd197; --out:#ff7a6e; --head:#0b2c25; --headink:#f2fbf7}
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali","Kalpurush",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.top{background:var(--head);color:var(--headink);border-radius:18px;padding:20px}
.top small{opacity:.75;font-size:14px}
.bal{font-size:40px;font-weight:700;margin:2px 0 14px;letter-spacing:-.5px}
.row{display:flex;gap:12px}
.row>div{flex:1;background:rgba(255,255,255,.1);border-radius:12px;padding:10px 12px}
.row b{display:block;font-size:19px}
.in{color:var(--in)} .out{color:var(--out)}
.top .in{color:#7ff0b8} .top .out{color:#ffa399}
h2{font-size:17px;margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;padding:10px;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;cursor:pointer}
.seg button.on.i{background:var(--in);color:#fff}
.seg button.on.o{background:var(--out);color:#fff}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--in);outline-offset:1px}
.two{display:flex;gap:10px}.two>div{flex:1}
.add{width:100%;margin-top:14px;padding:13px;border:0;border-radius:10px;background:var(--head);color:var(--headink);font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between}
.bar input{width:auto}
.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item .m{flex:1;min-width:0}
.item .m b{display:block}
.item .m span{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.amt{font-weight:700;white-space:nowrap}
.del{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px}
.empty{color:var(--muted);text-align:center;padding:18px 0}
.tools{display:flex;gap:10px;margin-top:14px}
.tools button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}
[hidden]{display:none!important}
.nav{display:flex;gap:8px;margin-bottom:14px}
.nav button{flex:1;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--muted);font:inherit;font-weight:700;cursor:pointer}
.nav button.on{background:var(--head);color:var(--headink);border-color:var(--head)}
.cyc{display:flex;align-items:center;gap:8px;margin:4px 0 12px}
.cyc b{flex:1;text-align:center;font-size:16px}
.cyc button{width:42px;height:42px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font-size:20px;cursor:pointer}
.punch{width:100%;padding:14px;border:0;border-radius:14px;background:var(--head);color:var(--headink);font:inherit;font-weight:700;font-size:17px;cursor:pointer;margin-bottom:12px}
.punch.done{background:var(--card);color:var(--in);border:1px solid var(--in)}
summary{font-weight:700;cursor:pointer;padding:8px 0}
.sum div{display:flex;justify-content:space-between;padding:4px 0}
.sum .tot{border-top:1px solid var(--line);margin-top:6px;padding-top:9px;font-weight:700;font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .w{font-size:12px;color:var(--muted)}
.c{border-radius:8px;border:1px solid var(--line);padding:3px 0;font-size:14px;line-height:1.2;min-height:46px}
.c.p{background:color-mix(in srgb,var(--in) 24%,var(--card))}
.c.v{background:color-mix(in srgb,#e0a100 32%,var(--card))}
.c.a{background:color-mix(in srgb,var(--out) 18%,var(--card))}
.c.t{outline:2px solid var(--ink)}
.c em{display:block;font-style:normal;font-size:10px;color:var(--muted)}
.c small{display:block;font-size:11px;font-weight:700;min-height:13px}
.leg{font-size:12px;color:var(--muted);margin-top:8px}
.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{font-size:12px;color:var(--muted);font-weight:600;padding:4px 2px}
.t td{padding:4px 2px;border-top:1px solid var(--line);text-align:center}
.t td:first-child{text-align:left;white-space:nowrap}
.t td small{color:var(--muted)}
.t .g{border-left:2px solid var(--line)}
.t .fri{background:color-mix(in srgb,var(--muted) 12%,transparent)}
.tk{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:transparent;font-size:17px;cursor:pointer;padding:0}
.tk.on{background:var(--in);border-color:var(--in);color:var(--bg)}
.tk.on.lv{background:#e0a100;border-color:#e0a100;color:#2b1d00}
.ot{width:54px;padding:7px 4px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav"><button type="button" id="n1" class="on">আয়-ব্যয়</button><button type="button" id="n2">অফিস হাজিরা</button></div>
<section id="v1">
  <div class="top">
    <small id="mlabel">এই মাসের হিসাব</small>
    <div class="bal" id="bal">৳ ০</div>
    <div class="row">
      <div><small>মোট আয়</small><b class="in" id="tin">৳ ০</b></div>
      <div><small>মোট ব্যয়</small><b class="out" id="tout">৳ ০</b></div>
    </div>
  </div>

  <h2>নতুন এন্ট্রি</h2>
  <div class="card">
    <div class="seg">
      <button type="button" class="on o" id="bOut">ব্যয়</button>
      <button type="button" class="i" id="bIn">আয়</button>
    </div>
    <div class="two">
      <div><label for="amount">টাকা</label><input id="amount" type="number" inputmode="decimal" min="0" placeholder="০"></div>
      <div><label for="date">তারিখ</label><input id="date" type="date"></div>
    </div>
    <label for="cat">ধরন</label>
    <select id="cat"></select>
    <label for="note">নোট (ঐচ্ছিক)</label>
    <input id="note" type="text" placeholder="যেমন: বাজার, বেতন">
    <button type="button" class="add" id="add">সংরক্ষণ করুন</button>
  </div>

  <div class="bar" style="margin-top:22px">
    <h2 style="margin:0">লেনদেন</h2>
    <input type="month" id="month" aria-label="মাস বাছাই করুন">
  </div>
  <div class="card" id="list" style="margin-top:8px"></div>

  <div class="tools">
    <button type="button" id="csv">CSV ডাউনলোড</button>
    <button type="button" id="clear">সব মুছুন</button>
  </div>
</section>
<section id="v2" hidden>
  <div class="cyc"><button type="button" id="pv" aria-label="আগের সাইকেল">‹</button><b id="cl"></b><button type="button" id="nx" aria-label="পরের সাইকেল">›</button></div>
  <button type="button" class="punch" id="punch"></button>
  <details id="set" class="card" style="margin-bottom:12px"><summary>রেট ও সেটিংস (একবারই দিতে হবে)</summary>
    <div class="two"><div><label for="s_salary">মাসিক বেতন (১–৩১)</label><input id="s_salary" type="number" inputmode="decimal" min="0"></div>
    <div><label for="s_start">সাইকেল শুরুর তারিখ</label><input id="s_start" type="number" inputmode="numeric" min="1" max="28"></div></div>
    <div class="two"><div><label for="s_lunch">লাঞ্চ বিল (প্রতিদিন)</label><input id="s_lunch" type="number" inputmode="decimal" min="0"></div>
    <div><label for="s_dinner">ডিনার বিল (প্রতিদিন)</label><input id="s_dinner" type="number" inputmode="decimal" min="0"></div></div>
    <label for="s_ot">ওভারটাইম (প্রতি ঘণ্টা)</label><input id="s_ot" type="number" inputmode="decimal" min="0">
  </details>
  <div class="card sum" id="sm"></div>
  <h2>ক্যালেন্ডার</h2>
  <div class="card"><div class="cal" id="cal"></div>
    <div class="leg">ল = লাঞ্চ, ড = ডিনার, ও = ওভারটাইম · সবুজ = হাজির, হলুদ = ছুটি, লাল = অনুপস্থিত</div></div>
  <h2>দৈনিক হিসাব</h2>
  <div class="card" style="padding:8px"><div style="overflow-x:auto"><table class="t" id="tb"></table></div></div>
</section>
</div>

<script>
(function(){
  var KEY="amar-hisab-v1";
  var CATS={
    out:["খাবার","বাজার","যাতায়াত","বাসা ভাড়া","বিল","চিকিৎসা","শিক্ষা","বিনোদন","অন্যান্য"],
    in:["বেতন","ব্যবসা","উপহার","অন্যান্য"]
  };
  var type="out", data=[];
  var $=function(id){return document.getElementById(id)};
  var bn=function(n){return String(n).replace(/\d/g,function(d){return "০১২৩৪৫৬৭৮৯"[d]})};
  var money=function(n){
    var r=Math.round(n*100)/100;
    return "৳ "+bn(r.toLocaleString("en-US"));
  };

  try{ data=JSON.parse(localStorage.getItem(KEY)||"[]"); }catch(e){ data=[]; }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(data)); }catch(e){} }

  function today(){
    var d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
    return d.toISOString().slice(0,10);
  }
  $("date").value=today();
  $("month").value=today().slice(0,7);

  function fillCats(){
    $("cat").innerHTML=CATS[type].map(function(c){return "<option>"+c+"</option>"}).join("");
  }
  function setType(t){
    type=t; fillCats();
    $("bOut").className=t==="out"?"on o":"o";
    $("bIn").className=t==="in"?"on i":"i";
  }
  $("bOut").onclick=function(){setType("out")};
  $("bIn").onclick=function(){setType("in")};
  fillCats();

  $("add").onclick=function(){
    var a=parseFloat($("amount").value);
    if(!(a>0)){ $("amount").focus(); return; }
    data.push({id:Date.now(),type:type,amount:a,cat:$("cat").value,note:$("note").value.trim(),date:$("date").value||today()});
    save();
    $("amount").value=""; $("note").value="";
    var m=data[data.length-1].date.slice(0,7);
    $("month").value=m;
    render();
  };

  $("month").onchange=render;

  function esc(s){return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

  function render(){
    var m=$("month").value||today().slice(0,7);
    var rows=data.filter(function(x){return x.date.slice(0,7)===m})
      .sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.id-a.id});
    var ti=0,to=0;
    rows.forEach(function(x){ if(x.type==="in")ti+=x.amount; else to+=x.amount; });
    $("tin").textContent=money(ti);
    $("tout").textContent=money(to);
    $("bal").textContent=money(ti-to);
    var d=new Date(m+"-01");
    $("mlabel").textContent=d.toLocaleDateString("bn-BD",{month:"long",year:"numeric"})+" মাসের হিসাব";
    if(!rows.length){
      $("list").innerHTML='<div class="empty">এই মাসে কোনো এন্ট্রি নেই। ওপরে প্রথম এন্ট্রি যোগ করুন।</div>';
      return;
    }
    $("list").innerHTML=rows.map(function(x){
      var dd=bn(x.date.slice(8,10))+"/"+bn(x.date.slice(5,7));
      return '<div class="item"><div class="m"><b>'+esc(x.cat)+'</b><span>'+dd+(x.note?" · "+esc(x.note):"")+'</span></div>'+
        '<div class="amt '+(x.type==="in"?"in":"out")+'">'+(x.type==="in"?"+":"−")+money(x.amount)+'</div>'+
        '<button class="del" data-id="'+x.id+'" aria-label="মুছুন">×</button></div>';
    }).join("");
  }

  $("list").onclick=function(e){
    var id=e.target.getAttribute&&e.target.getAttribute("data-id");
    if(!id) return;
    if(confirm("এই এন্ট্রি মুছে ফেলবেন?")){
      data=data.filter(function(x){return String(x.id)!==id});
      save(); render();
    }
  };

  $("clear").onclick=function(){
    if(data.length&&confirm("সব এন্ট্রি মুছে যাবে। নিশ্চিত?")){ data=[]; save(); render(); }
  };

  $("csv").onclick=function(){
    var lines=["তারিখ,ধরন,বিভাগ,টাকা,নোট"].concat(data.map(function(x){
      return [x.date,x.type==="in"?"আয়":"ব্যয়",x.cat,x.amount,'"'+x.note.replace(/"/g,'""')+'"'].join(",");
    }));
    var blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="hisab.csv";
    document.body.appendChild(a); a.click(); a.remove();
  };

  render();
})();
</script>
<script>
(function(){
  var K="amar-hisab-office-v1";
  var $=function(id){return document.getElementById(id)};
  var bn=function(n){return String(n).replace(/\d/g,function(d){return "০১২৩৪৫৬৭৮৯"[d]})};
  var money=function(n){return "৳ "+bn((Math.round(n*100)/100).toLocaleString("en-US"))};
  var pad=function(n){return n<10?"0"+n:""+n};
  var key=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
  var fmt=function(d,o){return d.toLocaleDateString("bn-BD",o)};
  var S={salary:0,lunch:0,dinner:0,ot:0,start:25},D={};
  try{var o=JSON.parse(localStorage.getItem(K)||"{}");for(var q in (o.s||{}))S[q]=o.s[q];D=o.d||{};}catch(e){}
  function save(){try{localStorage.setItem(K,JSON.stringify({s:S,d:D}))}catch(e){}}
  function startOf(d){return new Date(d.getFullYear(),d.getMonth()-(d.getDate()<S.start?1:0),S.start)}
  var cur=startOf(new Date());
  function span(){var a=[],e=new Date(cur.getFullYear(),cur.getMonth()+1,S.start);for(var d=new Date(cur);d<e;d.setDate(d.getDate()+1))a.push(new Date(d));return a}

  function rSum(ds){
    ds=ds||span();var tk=key(new Date()),c={p:0,v:0,a:0,l:0,d:0,o:0};
    ds.forEach(function(d){var k=key(d),x=D[k]||{};if(x.p)c.p++;else if(x.v)c.v++;else if(k<=tk)c.a++;if(x.l)c.l++;if(x.d)c.d++;c.o+=+x.ot||0});
    var L=c.l*S.lunch,Di=c.d*S.dinner,O=c.o*S.ot,B=L+Di+O;
    var r=function(a,b,cl){return '<div'+(cl?' class="'+cl+'"':'')+'><span>'+a+'</span><span>'+b+'</span></div>'};
    $("sm").innerHTML=r("উপস্থিত",bn(c.p)+" দিন")+r("ছুটি",bn(c.v)+" দিন")+r("অনুপস্থিত",bn(c.a)+" দিন")+
      r("লাঞ্চ বিল ("+bn(c.l)+" দিন)",money(L),"tot")+r("ডিনার বিল ("+bn(c.d)+" দিন)",money(Di))+
      r("ওভারটাইম ("+bn(c.o)+" ঘণ্টা)",money(O))+r("অফিস বিল মোট",money(B),"tot")+
      r("মাসিক বেতন (১–৩১ তারিখ)",money(+S.salary||0))+r("সর্বমোট",money(B+(+S.salary||0)),"tot");
  }
  function rCal(ds){
    ds=ds||span();var tk=key(new Date());
    var h="র সো ম বু বৃ শু শ".split(" ").map(function(w){return '<div class="w">'+w+'</div>'}).join("");
    for(var j=0;j<ds[0].getDay();j++)h+="<div></div>";
    ds.forEach(function(d,i){
      var k=key(d),x=D[k]||{},c=x.p?"p":x.v?"v":k<=tk?"a":"";
      h+='<div class="c '+c+(k===tk?" t":"")+'">'+(i===0||d.getDate()===1?'<em>'+fmt(d,{month:"short"})+'</em>':"")+bn(d.getDate())+'<small>'+(x.l?"ল ":"")+(x.d?"ড ":"")+(x.ot>0?"ও":"")+'</small></div>';
    });
    $("cal").innerHTML=h;
  }
  function rAll(){
    var ds=span(),tk=key(new Date()),t=D[tk]||{};
    $("cl").textContent=fmt(ds[0],{day:"numeric",month:"long"})+" – "+fmt(ds[ds.length-1],{day:"numeric",month:"long",year:"numeric"});
    $("punch").className="punch"+(t.p?" done":"");
    $("punch").textContent=t.p?"✓ আজ হাজিরা হয়েছে"+(t.t?" · "+bn(t.t):""):"আজকের হাজিরা দিন";
    var h='<tr><th rowspan="2">তারিখ</th><th rowspan="2">হাজিরা</th><th rowspan="2">ছুটি</th><th colspan="2">খাবার বিল</th><th rowspan="2" class="g">ওভার<br>টাইম</th></tr><tr><th>লাঞ্চ</th><th>ডিনার</th></tr>';
    ds.forEach(function(d){
      var k=key(d),x=D[k]||{};
      var b=function(f,l,c){return '<td><button type="button" class="tk'+(x[f]?" on":"")+(c||"")+'" data-k="'+k+'" data-f="'+f+'" aria-label="'+l+" "+bn(d.getDate())+'">✓</button></td>'};
      h+='<tr'+(d.getDay()===5?' class="fri"':'')+'><td><b>'+bn(d.getDate())+'</b> '+fmt(d,{weekday:"short"})+(x.t?'<br><small>'+bn(x.t)+'</small>':'')+'</td>'+
        b("p","হাজিরা")+b("v","ছুটি"," lv")+b("l","লাঞ্চ")+b("d","ডিনার")+
        '<td class="g"><input class="ot" type="number" inputmode="decimal" min="0" step="0.5" placeholder="০" data-k="'+k+'" value="'+(x.ot||"")+'" aria-label="ওভারটাইম ঘণ্টা '+bn(d.getDate())+'"></td></tr>';
    });
    $("tb").innerHTML=h;
    rCal(ds);rSum(ds);
  }
  $("tb").onclick=function(e){
    var b=e.target.closest&&e.target.closest(".tk");if(!b)return;
    var k=b.dataset.k,f=b.dataset.f,x=D[k]||(D[k]={});x[f]=x[f]?0:1;
    if(f==="p"){if(x.p)x.v=0;else x.t="";}
    if(f==="v"&&x.v){x.p=0;x.t="";}
    save();rAll();
  };
  $("tb").onchange=function(e){
    var i=e.target;if(!i.classList.contains("ot"))return;
    var x=D[i.dataset.k]||(D[i.dataset.k]={});x.ot=parseFloat(i.value)||0;save();rCal();rSum();
  };
  $("punch").onclick=function(){
    var n=new Date(),k=key(n),x=D[k]||(D[k]={});
    if(!x.p){x.p=1;x.v=0;x.t=pad(n.getHours())+":"+pad(n.getMinutes());save();}
    cur=startOf(n);rAll();
  };
  $("pv").onclick=function(){cur=new Date(cur.getFullYear(),cur.getMonth()-1,S.start);rAll()};
  $("nx").onclick=function(){cur=new Date(cur.getFullYear(),cur.getMonth()+1,S.start);rAll()};
  var F={s_salary:"salary",s_lunch:"lunch",s_dinner:"dinner",s_ot:"ot",s_start:"start"};
  Object.keys(F).forEach(function(id){
    var el=$(id);el.value=S[F[id]]||"";
    el.onchange=function(){
      var v=parseFloat(el.value)||0;
      if(F[id]==="start"){v=Math.min(28,Math.max(1,Math.round(v)||25));el.value=v;}
      S[F[id]]=v;save();
      if(F[id]==="start")cur=startOf(new Date());
      rAll();
    };
  });
  $("set").open=!(S.salary||S.lunch||S.dinner||S.ot);
  function tab(n){$("v1").hidden=n!==1;$("v2").hidden=n!==2;$("n1").className=n===1?"on":"";$("n2").className=n===2?"on":"";}
  $("n1").onclick=function(){tab(1)};$("n2").onclick=function(){tab(2)};
  rAll();
})();
</script>
</body>
</html>
